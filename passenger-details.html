<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passenger Details | Khagan Airlines</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/passenger-details.css">

</head>

<body>

<header>

    <div class="logo">✈ খাগান Airlines</div>

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="flights.html">Flights</a></li>

        </ul>

    </nav>

    <div class="theme-toggle">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
    </div>

</header>

<section class="page-title">

    <h1>Passenger Details</h1>

    <p>Please fill in the passenger information.</p>

</section>

<section class="form-section">

    <form id="passengerForm">

        <div class="input-group">

            <label>Full Name</label>

            <input type="text" id="name" required>

        </div>

        <div class="input-group">

            <label>Email</label>

            <input type="email" id="email" required>

        </div>

        <div class="input-group">

            <label>Phone Number</label>

            <input type="tel" id="phone" required>

        </div>

        <div class="input-group">

            <label>Passport / NID</label>

            <input type="text" id="passport" required>

        </div>

        <div class="input-group">

            <label>Date of Birth</label>

            <input type="date" id="dob" required>

        </div>

        <div class="input-group">

            <label>Gender</label>

            <select id="gender">

                <option>Male</option>

                <option>Female</option>

                <option>Other</option>

            </select>

        </div>

        <button type="submit">

            Continue to Payment

        </button>

    </form>

</section>

<script src="js/theme.js"></script>
<script src="js/passenger-details.js"></script>

</body>

</html>
