<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed | Khagan Airlines</title>

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/common.css">

    <link rel="stylesheet" href="css/booking-confirmation.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <div class="logo">

            ✈ খাগান Airlines

        </div>

        <nav>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="flights.html">Flights</a></li>

            </ul>

        </nav>

        <div class="theme-toggle">

            <i class="fa-solid fa-moon" id="theme-icon"></i>

        </div>

    </header>


    <!-- ================= SUCCESS ================= -->

    <section class="confirmation-section">

        <div class="success-icon">

            <i class="fa-solid fa-circle-check"></i>

        </div>

        <h1>

            Booking Confirmed

        </h1>

        <p>

            Thank you for choosing Khagan Airlines.

        </p>

    </section>


    <!-- ================= TICKET ================= -->

    <section class="ticket">

        <div class="ticket-header">

            <h2>

                ✈ KHAGAN AIRLINES

            </h2>

            <p>

                Electronic Boarding Pass

            </p>

        </div>

        <div class="ticket-body">

            <div class="row">

                <span>Booking ID</span>

                <strong id="bookingId"></strong>

            </div>

            <div class="row">

                <span>Passenger</span>

                <strong id="passengerName"></strong>

            </div>

            <div class="row">

                <span>Flight</span>

                <strong>KA101</strong>

            </div>

            <div class="row">

                <span>Route</span>

                <strong id="route"></strong>

            </div>

            <div class="row">

                <span>Seat</span>

                <strong id="seat"></strong>

            </div>

            <div class="row">

                <span>Class</span>

                <strong id="travelClass"></strong>

            </div>

            <div class="row">

                <span>Payment</span>

                <strong id="paymentMethod"></strong>

            </div>

            <div class="row">

                <span>Status</span>

                <strong class="paid">

                    PAID

                </strong>

            </div>

        </div>

    </section>


    <!-- ================= BUTTONS ================= -->

    <section class="buttons">

        <button onclick="window.print()">

            <i class="fa-solid fa-print"></i>

            Print Ticket

        </button>

        <button id="downloadBtn">

            <i class="fa-solid fa-download"></i>

            Download Ticket

        </button>

        <a href="index.html">

            <button>

                <i class="fa-solid fa-house"></i>

                Home

            </button>

        </a>

    </section>


    <script src="js/theme.js"></script>

    <script src="js/booking-confirmation.js"></script>

</body>

</html>
